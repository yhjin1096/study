# 스터디별 설정 — Notes on Linear Algebra
#                   Gyubeom Edward Im

# ── PDF ──────────────────────────────────────────────────────────────
pdf = ref/Notes on Linear Algebra.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 인쇄 쪽번호 + page_offset
# 목차가 PDF p1~4, 본문이 p5 부터 시작한다. p2/p10/p51 푸터가
# "STUDY NOTE 2/10/51 STUDY NOTE" → 오프셋 0
page_offset = 0

# ── 학습 범위 ────────────────────────────────────────────────────────
last_chapter = 9
book_pages = 1-51

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 이 문서에는 캡션이 하나도 없다. 전문에서 Figure/Table/Fig. 가 0회.
#   → extract_figures.py 를 쓸 수 없다. tools/extract_images_bbox.py 를 쓴다.
# 아래 두 값은 형식상 남겨 둔 것으로 실제로 쓰이지 않는다.
caption_style = flat
caption_bold  = no

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 판형: A4 595.28×841.89 (쿼터니언·Lie Theory 스터디와 동일)
# 실측(PDF p10): 본문 컬럼 x 72.0–523.3, 첫 줄 y 70.3, 푸터 y 803.0
clip_x   = 66-530
header_y = 66
body_x   = 76-520

# ── 메모 ─────────────────────────────────────────────────────────────
# 그림 19개 = 이미지 객체 19개 (1:1). bbox 방식이 정확하다 — 3_Pitfalls.md A10
#   p6(2) p7 p8 p10 p11 p13 p14 p16(2) p19 p20(2) p21 p22 p23 p26 p37 p42
#   bbox 가 전부 페이지 안쪽이라 전면 스캔이 아니다 (A5 아님)
# 번호 붙은 수식: (1)~(235) — 누락·중복 없음, 순서 일치
# 절: 129개 (h1 9 / h2 94 / h3 26). 네 스터디 중 절 수가 가장 많다
#
# ★ 파란 강조(#197fb2)가 매우 많다 — 114구간 · 4,366자 · 36쪽.
#   (Lie Theory 는 12구간 / 6쪽이었다)
#   display 수식 줄에 붙은 색 span 은 0개이고 색 붙은 수학은 전부 인라인이므로
#   ==강조== (CSS span) 만으로 전부 재현된다. \color 는 필요 없다 — 3_Pitfalls B6
#
# Tip 박스(tcolorbox)는 없다.

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = Notes on Linear Algebra
booktitle = Gyubeom Edward Im — 스터디 노트
