# 스터디별 설정 — Notes on Quaternion kinematics for the error-state Kalman filter
#                   Gyubeom Edward Im (Orig. by Joan Solà)

# ── PDF ──────────────────────────────────────────────────────────────
pdf = ref/Notes on Quaternion kinematics for the error-state Kalman filter.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 인쇄 쪽번호 + page_offset
# 검증: PDF p2/p40 푸터가 "STUDY NOTE 2 STUDY NOTE" / "... 40 ..." → 오프셋 0
page_offset = 0

# ── 학습 범위 ────────────────────────────────────────────────────────
last_chapter = 8
book_pages = 1-58

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 이 문서는 앞의 두 스터디와 달리 캡션이 있다. LaTeX article 기본 형식:
#   "Figure 1: 설명"  — 장 번호 없음 → flat
#   라벨 폰트 SFRM1000 (볼드 아님) → caption_bold = no
# 이 두 값으로 --list 를 돌려 19개 전부 검출되는 것을 확인했다.
caption_style = flat
caption_bold  = no

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 판형: A4 595.28×841.89 (앞의 두 스터디는 Letter 612×792 였다)
# 실측(PDF p10): 본문 컬럼 x 72.0–523.3, 첫 줄 y 72.6, 푸터 y 790.4
clip_x   = 66-530
header_y = 66
body_x   = 76-520

# ── 메모 ─────────────────────────────────────────────────────────────
# 그림 19개: p10 13 15 17 18 20 22 23 24 25 26(2개) 27 28 34 39(2개) 43 57
#   - Figure 18(p43), Figure 19(p57) 은 캡션이 "Table" 이며 실제로는 표 이미지다
# 번호 붙은 수식: (1)~(319) — 누락·중복 없음
# 본문이 "그림 1은 …" 처럼 그림을 인용하므로 check_refs 가 실제로 검사할 대상이 있다

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = Notes on Quaternion kinematics
booktitle = Gyubeom Edward Im — 스터디 노트
