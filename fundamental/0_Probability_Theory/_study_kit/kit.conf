# 스터디별 설정 — Notes on Probability Theory (Gyubeom Edward Im)

# ── PDF ──────────────────────────────────────────────────────────────
pdf = ref/Notes on Probability Theory.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 책에 인쇄된 쪽번호 + page_offset
# 검증: PDF p2/p30/p45 의 푸터가 각각 "STUDY NOTE 2 STUDY NOTE", "... 30 ...", "... 45 ..."
#       → 오프셋 0. 앞·중간·뒤 세 곳 모두 일치.
page_offset = 0

# ── 학습 범위 ────────────────────────────────────────────────────────
last_chapter = 13
book_pages = 1-45

# ── 캡션 형식 ────────────────────────────────────────────────────────
# ⚠️ 이 문서에는 Figure/Table 캡션이 하나도 없다 (전문 스캔 결과 0건, Example 11 · Definition 2).
#    따라서 extract_figures.py 는 이 문서에 쓸 수 없다.
#    그림 12개는 tools/extract_images_bbox.py 가 get_image_info() 의 bbox 를 clip 으로
#    직접 렌더링해 뽑는다. 아래 두 값은 이 스터디에서 사용되지 않는다.
caption_style = flat
caption_bold  = no

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 판형: Letter 612×792 (킷 기본값 576×648 이 아님)
# 실측(PDF p5): 본문 컬럼 x 90.0–513.0, 푸터 y 773.0, 본문 시작 y≈107
clip_x   = 85-518
header_y = 100
body_x   = 95-508

# ── 메모 ─────────────────────────────────────────────────────────────
# 그림 위치(PDF 쪽): 5(2개) 8 10 11 12 24 25 30 31(2개) 33 — 합계 12개
# 번호 붙은 수식: (1)~(162)

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = Notes on Probability Theory
booktitle = Gyubeom Edward Im — 스터디 노트
