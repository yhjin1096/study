# ── 메모 ─────────────────────────────────────────────────────────────
# 24쪽, 식 (1)~(101), 절 8장 + 소절 12개.
#
# 번호 붙은 수식: (1)~(101) — 누락·중복 없음, 순서 일치
#   (본문 "so(3)" 가 줄 끝에 오면 (3) 으로 오검출되니 주의)
#
# 그림 9개 = 이미지 객체 9개 (1:1). 캡션이 하나도 없다.
#   p2 p3 p4 p8(2) p9 p13 p20 p21
#
# ★ 색이 네 가지다 — 지금까지 스터디 중 가장 많다.
#   #197fb2 파랑   산문 강조 (nanummjb*/SFBX1000)  — 표준
#   #a50000 진홍   수식 강조(p4·p5·p19) + 산문 강조(p12·p17·p19·p23)
#   #ff0000 빨강   "빨간색" 범례 + sourcePoints + 수식의 source 항 (p2·p3)
#   #00ffff 하늘   "파란색" 범례 + targetPoints + 수식의 target 항 (p2·p3)
#
#   빨강/하늘은 **그림의 점 색을 가리키는 범례**다. 원문이
#   "빨간색 점 = sourcePoints, 파란색 점 = targetPoints" 라고 쓰고
#   이후 수식에서도 같은 색으로 항을 구분한다. 의미가 있으므로 반드시 재현한다.
#   (#00ffff 는 흰 배경에서 흐리지만 원문 그대로 둔다. 다크 모드 대비만 CSS 로 손본다.)
#
# 코드 리스팅 없음 — 문서 전체에 고정폭 폰트가 0회.
#   sourcePoints/targetPoints 는 본문 폰트(SFRM1000)로 쓴 인라인 식별자다.
#
# 표기: SVD 기반 닫힌 해, SO(3)/so(3) 최소제곱, point-to-plane 법선,
#   GICP 의 확률적 정식화(공분산 C_t, C_{t+1}).
#   Gauss-Newton 과 리 군 섭동이 앞 스터디들과 겹치므로 window.EJ 를 물려받는다.

