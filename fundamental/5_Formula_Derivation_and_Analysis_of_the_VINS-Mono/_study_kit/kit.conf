# ── 캡션 형식 ────────────────────────────────────────────────────────
# 번호 붙은 그림 캡션이 하나도 없다. 전문에서 "Figure" 는 본문 안내로 1회,
# "Fig." · "Table" 은 0회.
#   → extract_figures.py 를 쓸 수 없다. tools/extract_images_bbox.py 를 쓴다.
# 아래 두 값은 형식상 남겨 둔 것으로 실제로 쓰이지 않는다.
caption_style = flat
