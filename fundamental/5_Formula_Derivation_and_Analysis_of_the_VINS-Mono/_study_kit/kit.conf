# ── 메모 ─────────────────────────────────────────────────────────────
# 번호 붙은 수식: (1)~(88) — 누락·중복 없음, 순서 일치
# 절: 8개 장 + 하위 10개 = 18개
#
# 그림 10개 = 이미지 객체 10개 (1:1). bbox 가 전부 페이지 안쪽이라
#   전면 스캔이 아니다 (3_Pitfalls A5 아님, A10 해당).
#   p2 p3(2) p4 p5 p6 p7 p8 p9 p13
#
# ★ 색이 세 가지다.
#   #197fb2 (파랑) — 산문 강조 23구간. 폰트가 nanummjb*/SFBX 다.
#     ==강조== → <span class="hl"> 로 재현한다.
#     "1) Gyroscope Bias Calibration:" 처럼 소제목 노릇을 하는 것도 이 색이다.
#
#   #ff0000 (빨강) · #0000ff (파랑) — 수식 안. 각 4구간, 합쳐 8구간뿐이다.
#     p14 식 (41) 의 p^b_c(빨강) / q^b_c(파랑),
#     p18 식 (77) 근처의 P^w_{b_j}(빨강) / P^c_b(파랑).
#     본문에서 두 항을 짝지어 가리키려고 쓴 색이다.
#     → \color{#ff0000}{...} · \color{#0000ff}{...}
#       vendor/tex-svg.js 에 color·boldsymbol 이 이미 붙어 있다 (3_Pitfalls B6).
#
#   색 위치는 눈으로 찾지 말고 tools/dump_colored.py 로 뽑아서 대조한다.
#   (이 스터디는 색이 세 가지라 dump_colored.py 의 COLORS 목록을 늘렸다)
#
# 표기: 이 문서는 SO(3) 가 아니라 쿼터니언 기반이다.
#   ⊗ (쿼터니언 곱), Ω_L(ω)/Ω_R(ω) (좌·우 곱셈 연산자), α/β/γ (preintegration 항),
#   [·]_× (반대칭행렬), R{·} (회전행렬로 변환).
#   NOMENCLATURE 가 p2 에 정리되어 있다.
#
# Tip 박스(tcolorbox)는 없다. 대신 "NOTICE:" 로 시작하는 파란 강조 문단이 여럿 있다.

