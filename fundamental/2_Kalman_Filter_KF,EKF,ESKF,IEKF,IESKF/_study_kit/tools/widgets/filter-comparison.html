<!--
  위젯 11 — 다섯 필터 한 문제에 올리기  (원문 §11 Wrap-up 보조)

  같은 1차원 비선형 문제를 KF · EKF · ESKF · IEKF · IESKF 로 동시에 돌려 RMSE 를 잰다.
    모션   x_t = x_{t-1} + u + a·sin(x_{t-1}) + w
    관측   z_t = sin(λx_t)/λ + v
  KF 는 비선형을 무시하고 f, h 를 선형으로 가정한다(§3 의 제약조건). 나머지는 §4~§7 의 식을 그대로 쓴다.
  1차원 평평한 공간에서는 ⊞ = + 이고 J = 1 이므로 ESKF ≡ EKF, IESKF ≡ IEKF 가 되는데,
  이 사실 자체가 §7.1 "공통점"의 수치적 확인이다.
-->
<div class="lab" id="w-cmp">
  <div class="lab-head">
    <span class="lab-tag">실험 11</span>
    <span class="lab-title">다섯 필터를 같은 문제에 올려 보기</span>
    <span class="lab-note">원문에 없는 추가 요소 · §11 Wrap-up 보조</span>
  </div>
  <div class="lab-body">
    <p>§11이 한 장씩 요약한 다섯 필터를 <b>같은 비선형 문제</b>에 올려 RMSE로 비교한다.
       <b>KF</b>는 비선형을 무시하고 선형 모델로 밀어붙이므로(§3의 제약조건) 비선형성
       <code>a·λ</code>를 키우면 가장 먼저 무너진다. <b>ESKF는 EKF와, IESKF는 IEKF와 수치가 일치</b>하는데,
       1차원 평평한 공간에서는 <code>⊞ = +</code>이고 <code>J = 1</code>이기 때문이다 — §7.1이 말한
       "공통점"이 그대로 드러난다.</p>

    <div class="sliders">
      <div class="slider">
        <label><span>모션 비선형성 a</span><b id="fc-v-a">0.80</b></label>
        <input type="range" id="fc-s-a" min="0" max="2" step="0.05" value="0.8">
      </div>
      <div class="slider">
        <label><span>관측 비선형성 λ</span><b id="fc-v-l">0.70</b></label>
        <input type="range" id="fc-s-l" min="0.05" max="1.4" step="0.01" value="0.7">
      </div>
      <div class="slider">
        <label><span>센서 노이즈 R</span><b id="fc-v-r">0.05</b></label>
        <input type="range" id="fc-s-r" min="0.005" max="0.5" step="0.005" value="0.05">
      </div>
      <div class="slider">
        <label><span>반복 수 (IEKF·IESKF)</span><b id="fc-v-n">5</b></label>
        <input type="range" id="fc-s-n" min="1" max="10" step="1" value="5">
      </div>
    </div>
    <div class="btnrow">
      <button data-act="regen">새 시나리오</button>
      <button class="ghost" data-act="linear">거의 선형으로</button>
      <button class="ghost" data-act="hard">아주 비선형으로</button>
    </div>

    <canvas id="fc-canvas" width="880" height="360"></canvas>
    <div class="legend">
      <span><i class="swatch" style="background:var(--ink-faint)"></i>참값</span>
      <span><i class="swatch" style="background:var(--predict)"></i>KF</span>
      <span><i class="swatch" style="background:var(--accent)"></i>EKF · ESKF</span>
      <span><i class="swatch" style="background:var(--correct)"></i>IEKF · IESKF</span>
    </div>
    <div class="readout" id="fc-readout"></div>
  </div>
</div>

<script>
(function () {
  var cv = document.getElementById('fc-canvas'), ctx = cv.getContext('2d');
  var out = document.getElementById('fc-readout');
  var T = 70, Q = 0.02, truth = [], meas = [];
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function val(id) { return parseFloat(document.getElementById(id).value); }
  function set(id, v) { document.getElementById(id).value = v; }
  function gauss() {
    var u = 1 - Math.random(), v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function f(x, a) { return x + 0.22 + a * Math.sin(x); }
  function Fj(x, a) { return 1 + a * Math.cos(x); }
  function h(x, l) { return Math.sin(l * x) / l; }
  function Hj(x, l) { return Math.cos(l * x); }

  function regen() {
    var a = val('fc-s-a'), l = val('fc-s-l'), r = val('fc-s-r');
    truth = []; meas = [];
    var x = 0.2;
    for (var t = 0; t < T; t++) {
      x = f(x, a) + Math.sqrt(Q) * gauss();
      truth.push(x);
      meas.push(h(x, l) + Math.sqrt(r) * gauss());
    }
    draw();
  }

  // 다섯 필터. 1차원이므로 행렬 대신 스칼라.
  function runAll() {
    var a = val('fc-s-a'), l = val('fc-s-l'), r = val('fc-s-r'), NIT = Math.round(val('fc-s-n'));
    var st = { kf: { x: 0.2, P: 1 }, ekf: { x: 0.2, P: 1 }, eskf: { x: 0.2, P: 1 }, iekf: { x: 0.2, P: 1 }, ieskf: { x: 0.2, P: 1 } };
    var tr = { kf: [], ekf: [], eskf: [], iekf: [], ieskf: [] };
    for (var t = 0; t < T; t++) {
      var z = meas[t];
      // ── KF : 선형 가정 (F = H = 1). §3 의 제약조건을 어긴 채 그대로 사용
      st.kf.x = st.kf.x + 0.22;
      st.kf.P = st.kf.P + Q;
      var Kk = st.kf.P / (st.kf.P + r);
      st.kf.x = st.kf.x + Kk * (z - st.kf.x);
      st.kf.P = (1 - Kk) * st.kf.P;
      // ── EKF : 식 (40)(41)
      var Fe = Fj(st.ekf.x, a);
      var xm = f(st.ekf.x, a), Pm = Fe * st.ekf.P * Fe + Q;
      var He = Hj(xm, l), Ke = Pm * He / (He * Pm * He + r);
      st.ekf.x = xm + Ke * (z - h(xm, l));
      st.ekf.P = (1 - Ke * He) * Pm;
      // ── ESKF : 식 (57)(58) — nominal 에 δx 를 주입하고 reset
      var Fs = Fj(st.eskf.x, a);
      var xs_ = f(st.eskf.x, a), Ps = Fs * st.eskf.P * Fs + Q;
      var Hs = Hj(xs_, l), Ks = Ps * Hs / (Hs * Ps * Hs + r);
      var dxs = Ks * (z - h(xs_, l));          // δx̂_{t|t}
      st.eskf.x = xs_ + dxs;                   // nominal 에 주입 후 δx̂ ← 0 (reset)
      st.eskf.P = (1 - Ks * Hs) * Ps;
      // ── IEKF : 식 (70) + (158) 형태의 반복 보정
      var Fi = Fj(st.iekf.x, a);
      var xi = f(st.iekf.x, a), Pi = Fi * st.iekf.P * Fi + Q, xj = xi, Ki = 0, Hi = 0;
      for (var j = 0; j < NIT; j++) {
        Hi = Hj(xj, l); Ki = Pi * Hi / (Hi * Pi * Hi + r);
        xj = xi + Ki * (z - h(xj, l) - Hi * (xi - xj));
      }
      st.iekf.x = xj; st.iekf.P = (1 - Ki * Hi) * Pi;
      // ── IESKF : 식 (93)(94), J = 1
      var Fk = Fj(st.ieskf.x, a);
      var xk = f(st.ieskf.x, a), Pk = Fk * st.ieskf.P * Fk + Q, xj2 = xk, Kk2 = 0, Hk = 0;
      for (var j2 = 0; j2 < NIT; j2++) {
        Hk = Hj(xj2, l);
        var S = Hk * Pk * Hk + r;
        Kk2 = Pk * Hk / S;
        var c = xj2 - xk;
        xj2 = xj2 + (Kk2 * (z - h(xj2, l) + Hk * c) - c);
      }
      st.ieskf.x = xj2; st.ieskf.P = (1 - Kk2 * Hk) * Pk;

      tr.kf.push(st.kf.x); tr.ekf.push(st.ekf.x); tr.eskf.push(st.eskf.x);
      tr.iekf.push(st.iekf.x); tr.ieskf.push(st.ieskf.x);
    }
    return tr;
  }

  function rmse(arr) {
    var s = 0;
    for (var i = 0; i < T; i++) s += Math.pow(arr[i] - truth[i], 2);
    return Math.sqrt(s / T);
  }

  function draw() {
    document.getElementById('fc-v-a').textContent = val('fc-s-a').toFixed(2);
    document.getElementById('fc-v-l').textContent = val('fc-s-l').toFixed(2);
    document.getElementById('fc-v-r').textContent = val('fc-s-r').toFixed(3);
    document.getElementById('fc-v-n').textContent = Math.round(val('fc-s-n'));
    if (truth.length !== T) { regen(); return; }
    var tr = runAll();

    var dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = 360;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var padL = 52, padR = 16, padT = 18, padB = 34, i;
    var all = truth.concat(tr.kf, tr.ekf, tr.iekf);
    var y0 = Math.min.apply(null, all), y1 = Math.max.apply(null, all);
    var m = (y1 - y0) * 0.08 + 0.2; y0 -= m; y1 += m;
    function PX(t) { return padL + (W - padL - padR) * t / (T - 1); }
    function PY(v) { return H - padB - (H - padT - padB) * (v - y0) / (y1 - y0); }

    ctx.strokeStyle = css('--rule-soft'); ctx.lineWidth = 1;
    ctx.fillStyle = css('--ink-faint'); ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'right';
    for (var g = 0; g <= 4; g++) {
      var yv = y0 + (y1 - y0) * g / 4;
      ctx.beginPath(); ctx.moveTo(padL, PY(yv)); ctx.lineTo(W - padR, PY(yv)); ctx.stroke();
      ctx.fillText(yv.toFixed(1), padL - 6, PY(yv) + 4);
    }
    ctx.textAlign = 'center';
    for (var s2 = 0; s2 <= 7; s2++) ctx.fillText(Math.round((T - 1) * s2 / 7), PX((T - 1) * s2 / 7), H - padB + 15);
    ctx.strokeStyle = css('--rule'); ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();

    function line(arr, color, wid, dash) {
      ctx.setLineDash(dash || []); ctx.strokeStyle = css(color); ctx.lineWidth = wid; ctx.beginPath();
      arr.forEach(function (v, t) { t ? ctx.lineTo(PX(t), PY(v)) : ctx.moveTo(PX(t), PY(v)); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    line(truth, '--ink-faint', 2.6);
    line(tr.kf, '--predict', 1.8);
    line(tr.ekf, '--accent', 2.2);
    line(tr.eskf, '--accent', 1, [3, 3]);
    line(tr.iekf, '--correct', 2.2);
    line(tr.ieskf, '--correct', 1, [3, 3]);

    var rk = rmse(tr.kf), re = rmse(tr.ekf), rs = rmse(tr.eskf), ri = rmse(tr.iekf), ris = rmse(tr.ieskf);
    var dEskf = 0, dIeskf = 0;
    for (i = 0; i < T; i++) {
      dEskf = Math.max(dEskf, Math.abs(tr.ekf[i] - tr.eskf[i]));
      dIeskf = Math.max(dIeskf, Math.abs(tr.iekf[i] - tr.ieskf[i]));
    }

    out.innerHTML =
      'RMSE &nbsp; KF <b>' + rk.toFixed(4) + '</b> &nbsp;·&nbsp; EKF <b>' + re.toFixed(4) +
      '</b> &nbsp;·&nbsp; ESKF <b>' + rs.toFixed(4) + '</b> &nbsp;·&nbsp; IEKF <b>' + ri.toFixed(4) +
      '</b> &nbsp;·&nbsp; IESKF <b>' + ris.toFixed(4) + '</b><br>' +
      'EKF vs ESKF 최대 차이 <b>' + dEskf.toExponential(2) + '</b> &nbsp;·&nbsp; IEKF vs IESKF 최대 차이 <b>' +
      dIeskf.toExponential(2) + '</b> → 1차원 평평한 공간에서는 ⊞ = + 이고 J = 1 이라 <b>서로 같은 필터가 된다</b> (§7.1)<br>' +
      (rk > re * 1.2
        ? '→ <b>KF가 뒤처진다.</b> 비선형 모델에 선형 KF를 그대로 쓰면 안 되는 이유(§4 도입부)가 숫자로 보인다'
        : '→ 지금은 거의 선형이라 KF도 버틴다. a·λ를 키워 보라') +
      (ri < re * 0.98 ? ' &nbsp;·&nbsp; 반복(IEKF)이 EKF보다 <b>' + (100 * (1 - ri / re)).toFixed(1) + '%</b> 낫다' : '');
  }

  document.querySelectorAll('#w-cmp [data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = b.dataset.act;
      if (a === 'linear') { set('fc-s-a', 0.05); set('fc-s-l', 0.08); }
      else if (a === 'hard') { set('fc-s-a', 1.6); set('fc-s-l', 1.3); }
      regen();
    });
  });
  ['fc-s-a', 'fc-s-l', 'fc-s-r'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', regen);
  });
  document.getElementById('fc-s-n').addEventListener('input', draw);
  window.addEventListener('resize', draw);
  regen();
})();
</script>
