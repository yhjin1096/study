# 스터디별 설정 — Notes on On-manifold preintegration for
#                   real-time visual-inertial odometry
#                   Gyubeom Edward Im (Orig. by C. Forster)

# ── PDF ──────────────────────────────────────────────────────────────
pdf = ref/Notes on On-manifold preintegration for real-time visual-inertial odometry.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 인쇄 쪽번호 + page_offset
# p7/p14 푸터가 "STUDY NOTE 7/14 STUDY NOTE" → 오프셋 0
page_offset = 0

# ── 학습 범위 ────────────────────────────────────────────────────────
# 1~6장 + 부록 A(A.1~A.5) + B 참고문헌 + C 개정이력
last_chapter = 6
book_pages = 1-18

# ── 캡션 형식 ────────────────────────────────────────────────────────
# ★ 이 문서에는 그림이 하나도 없다.
#   이미지 객체 0개 · 전문에서 Figure/Table 0회 · 30pt 넘는 벡터 드로잉 0개
#   (p15~17 의 드로잉 20~37개는 전부 분수선·행렬 괘선·under/overbrace 다)
#   → extract_figures.py 와 extract_images_bbox.py 를 이 스터디에서는 쓰지 않는다.
# 아래 값들은 형식상 남겨 둔 것이다.
caption_style = flat
caption_bold  = no

# ── 레이아웃 (pt 단위) ───────────────────────────────────────────────
# 판형: A4 595.28×841.89
clip_x   = 66-530
header_y = 66
body_x   = 76-520

# ── 메모 ─────────────────────────────────────────────────────────────
# 번호 붙은 수식: (1)~(82) — 누락·중복 없음, 순서 일치
#
# ★★ 색이 두 가지다. 앞선 다섯 스터디와 결정적으로 다른 점이다.
#
#   #197fb2 (파랑) — 산문 강조. 폰트가 nanummjb*/SFBX(고딕·산세리프 볼드)다.
#     지금까지처럼 ==강조== → <span class="hl"> 로 재현한다.
#     강조 구간 안의 인라인 수식은 currentColor 를 타고 같이 물든다.
#
#   #a50000 (진홍) — 수식 내부 강조. 폰트가 CMMI/CMSY/CMEX/CMMIB 로
#     전부 수학 글리프다. 210구간. CSS 로는 재현할 수 없고 \color 가 필요하다.
#     → tools/vendor/tex-svg.js 를 다음과 같이 다시 만들어 해결했다:
#          cat tex-svg.js color.js boldsymbol.js > vendor/tex-svg.js
#       (mathjax@3.2.2 es5/input/tex/extensions/{color,boldsymbol}.js)
#       그리고 build_html.py 의 tex 설정에 packages: {'[+]': ['color','boldsymbol']}
#       loader.load 로 부르면 안 된다 — 그러면 네트워크를 타서 B6 에 걸린다.
#       cancel.js 는 같은 방법으로도 동작하지 않는다(이 문서엔 불필요).
#
#     \boldsymbol 이 살아난 것이 중요하다. 이 문서는 볼드 그리스 문자
#     (ω, η, ϕ, Σ, τ)가 본문 전반에 깔려 있어 \pmb 치환으로는 원문과 모양이 다르다.
#
#   색 위치는 눈으로 찾지 말고 tools/dump_colored.py 로 뽑아서 대조한다.
#
# Tip 박스(tcolorbox)는 없다. 대신 \boxed 로 감싼 수식이 있다((34) 등).

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = On-manifold IMU Preintegration
booktitle = Gyubeom Edward Im — 스터디 노트
