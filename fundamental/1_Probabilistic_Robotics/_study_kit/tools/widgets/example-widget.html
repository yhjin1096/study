<!--
  예시 위젯 — 이 파일을 복사해 시작하라.

  하는 일: 정규분포 하나를 슬라이더로 조절하며 그리고, 표본을 뽑아 히스토그램과 비교한다.
  도메인에 무관한 뼈대이므로 어떤 책의 스터디에서도 출발점으로 쓸 수 있다.

  구조·CSS 자산·주의점은 _GUIDE.md 참조.
-->
<div class="lab" id="w-example">
  <div class="lab-head">
    <span class="lab-tag">예시</span>
    <span class="lab-title">Example — 정규분포와 표본</span>
    <span class="lab-note">위젯 뼈대 (복사해서 쓰세요)</span>
  </div>
  <div class="lab-body">
    <p>슬라이더로 <code>μ</code>·<code>σ</code>를 바꾸면 밀도 곡선이 따라 움직이고,
       그 분포에서 뽑은 <b>표본의 히스토그램</b>이 함께 그려진다.
       표본 수를 늘리면 히스토그램이 곡선에 수렴하는 것을 볼 수 있다 — 큰 수의 법칙.</p>

    <div class="sliders">
      <div class="slider">
        <label><span>평균 μ</span><b id="ex-v-mu">0.00</b></label>
        <input type="range" id="ex-s-mu" min="-3" max="3" step="0.05" value="0">
      </div>
      <div class="slider">
        <label><span>표준편차 σ</span><b id="ex-v-sd">1.00</b></label>
        <input type="range" id="ex-s-sd" min="0.2" max="3" step="0.05" value="1">
      </div>
      <div class="slider">
        <label><span>표본 수 N</span><b id="ex-v-n">300</b></label>
        <input type="range" id="ex-s-n" min="20" max="5000" step="20" value="300">
      </div>
    </div>
    <div class="btnrow">
      <button data-act="resample">표본 다시 뽑기</button>
      <button class="ghost" data-act="hist">히스토그램 켜기/끄기</button>
      <button class="ghost" data-act="reset">초기화</button>
    </div>

    <canvas id="ex-canvas" width="880" height="300"></canvas>
    <div class="legend">
      <span><i class="swatch" style="background:var(--ink)"></i>밀도 p(x)</span>
      <span><i class="swatch" style="background:var(--correct)"></i>표본 히스토그램</span>
      <span><i class="swatch" style="background:var(--accent)"></i>평균 μ</span>
    </div>
    <div class="readout" id="ex-readout"></div>
  </div>
</div>

<script>
(function () {                       // 즉시실행함수로 전역 오염을 막는다
  var cv = document.getElementById('ex-canvas'), ctx = cv.getContext('2d');
  var out = document.getElementById('ex-readout');
  var showHist = true, samples = [];

  // CSS 변수를 읽어 쓴다 — 라이트/다크 테마가 자동으로 따라간다
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function val(id) { return parseFloat(document.getElementById(id).value); }

  function gauss() {                 // Box–Muller
    var u = 1 - Math.random(), v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function pdf(x, mu, sd) {
    return Math.exp(-0.5 * (x - mu) * (x - mu) / (sd * sd)) / (sd * Math.sqrt(2 * Math.PI));
  }

  function resample() {
    var mu = val('ex-s-mu'), sd = val('ex-s-sd'), n = Math.round(val('ex-s-n'));
    samples = [];
    for (var i = 0; i < n; i++) samples.push(mu + gauss() * sd);
    draw();
  }

  function draw() {
    var mu = val('ex-s-mu'), sd = val('ex-s-sd'), n = Math.round(val('ex-s-n'));
    document.getElementById('ex-v-mu').textContent = mu.toFixed(2);
    document.getElementById('ex-v-sd').textContent = sd.toFixed(2);
    document.getElementById('ex-v-n').textContent = n;
    if (samples.length !== n) resample();          // 표본 수가 바뀌면 다시 뽑는다

    // 고해상도 대응 — _GUIDE.md "캔버스 기본 패턴"
    var dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = 300;
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var padL = 40, padR = 14, padT = 14, padB = 28;
    var xmin = -8, xmax = 8;
    var ymax = pdf(0, 0, 0.2) * 0.55;              // 축 높이를 고정해 슬라이더에 덜 흔들리게
    function PX(x) { return padL + (W - padL - padR) * (x - xmin) / (xmax - xmin); }
    function PY(y) { return H - padB - (H - padB - padT) * Math.min(y / ymax, 1); }

    // 축
    ctx.strokeStyle = css('--rule'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB);
    ctx.lineTo(W - padR, H - padB); ctx.stroke();
    ctx.fillStyle = css('--ink-faint'); ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (var t = -8; t <= 8; t += 2) ctx.fillText(t, PX(t), H - padB + 14);

    // 표본 히스토그램
    if (showHist && samples.length) {
      var NB = 60, hist = new Array(NB).fill(0);
      samples.forEach(function (s) {
        var b = Math.floor((s - xmin) / (xmax - xmin) * NB);
        if (b >= 0 && b < NB) hist[b]++;
      });
      var bw = (xmax - xmin) / NB;
      ctx.fillStyle = css('--correct'); ctx.globalAlpha = 0.35;
      for (var b2 = 0; b2 < NB; b2++) {
        var dens = hist[b2] / (samples.length * bw);          // 밀도로 정규화해 곡선과 비교 가능
        var x0 = PX(xmin + b2 * bw), x1 = PX(xmin + (b2 + 1) * bw);
        ctx.fillRect(x0, PY(dens), x1 - x0 - 0.5, H - padB - PY(dens));
      }
      ctx.globalAlpha = 1;
    }

    // 밀도 곡선
    ctx.strokeStyle = css('--ink'); ctx.lineWidth = 2.2; ctx.beginPath();
    for (var i = 0; i <= 400; i++) {
      var x = xmin + (xmax - xmin) * i / 400, y = pdf(x, mu, sd);
      i ? ctx.lineTo(PX(x), PY(y)) : ctx.moveTo(PX(x), PY(y));
    }
    ctx.stroke();

    // 평균 표시
    ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(PX(mu), padT); ctx.lineTo(PX(mu), H - padB); ctx.stroke();
    ctx.setLineDash([]);

    // 숫자 출력 — 노트의 예제 수치와 대조할 수 있게 만든다
    var m = samples.reduce(function (a, b) { return a + b; }, 0) / (samples.length || 1);
    var v = samples.reduce(function (a, b) { return a + (b - m) * (b - m); }, 0) / (samples.length || 1);
    out.innerHTML =
      '이론값 μ = <b>' + mu.toFixed(3) + '</b>, σ = <b>' + sd.toFixed(3) + '</b><br>' +
      '표본값 (N=' + samples.length + ') 평균 <b>' + m.toFixed(3) + '</b>, ' +
      '표준편차 <b>' + Math.sqrt(v).toFixed(3) + '</b> · ' +
      '오차 ' + Math.abs(m - mu).toFixed(3) + ' / ' + Math.abs(Math.sqrt(v) - sd).toFixed(3);
  }

  document.querySelectorAll('#w-example [data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = b.dataset.act;
      if (a === 'resample') resample();
      else if (a === 'hist') { showHist = !showHist; draw(); }
      else {
        document.getElementById('ex-s-mu').value = 0;
        document.getElementById('ex-s-sd').value = 1;
        document.getElementById('ex-s-n').value = 300;
        resample();
      }
    });
  });
  ['ex-s-mu', 'ex-s-sd', 'ex-s-n'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', draw);
  });
  window.addEventListener('resize', draw);
  resample();
})();
</script>
