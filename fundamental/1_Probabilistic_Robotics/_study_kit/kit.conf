# Probabilistic Robotics 스터디 설정
# tools/build_html.py · extract_figures.py · check_refs.py 가 읽는다.
# 이 파일은 킷 루트(_study_kit/)에 둔다. ref/ 와 노트는 그 상위(스터디 루트)에 있다.

# ── PDF ──────────────────────────────────────────────────────────────
# ref/ 에 PDF가 하나뿐이라 자동 탐색된다. 명시하려면 아래 주석을 푼다.
# pdf = ref/Probabilistic Robotics _Sebastian Thrun et al..pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 책에 인쇄된 쪽번호 + 21
# 검증됨: 책 p.39=PDF 60, p.85=106, p.117=138, p.149=170, p.487=508, p.647=668
page_offset = 21

# ── 학습 범위 ────────────────────────────────────────────────────────
# 1~8장 (Part I Basics + Part II Localization). 9장 이후는 범위 밖.
last_chapter = 8

# 책 쪽번호의 유효 범위. PDF 총 668쪽 (pdfinfo 확인), 마지막 책 쪽번호 647.
book_pages = 1-647

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 이 책은 "Figure 6.3" 형식이고 라벨이 볼드(Palatino-Bold 9pt)다.
caption_style = chapter
caption_bold  = yes

# ── 그림 추출 레이아웃 (pt) ──────────────────────────────────────────
# 판형 576×648pt. 서브패널 라벨 "(a)"가 x=156.0 에서 시작하므로 clip 좌경계를 155로 둔다.
clip_x   = 155-522
header_y = 52
body_x   = 186-488

# ── 메모 ─────────────────────────────────────────────────────────────
# 이 책에 존재하지 않는 그림 번호 (저자의 번호 건너뜀, PDF 전문 검색으로 확인):
#   Figure 3.1, Figure 8.15

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = Probabilistic Robotics
booktitle = Thrun · Burgard · Fox — 스터디 노트
