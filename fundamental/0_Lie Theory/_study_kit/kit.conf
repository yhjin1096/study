# 스터디별 설정 — Notes on Lie Theory
#                   Gyubeom Edward Im

# ── PDF ──────────────────────────────────────────────────────────────
pdf = ref/Notes on Lie Theory.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 인쇄 쪽번호 + page_offset
# 검증: PDF p3/p10/p26 푸터가 "STUDY NOTE 3/10/26 STUDY NOTE" → 오프셋 0
page_offset = 0

# ── 학습 범위 ────────────────────────────────────────────────────────
last_chapter = 8
book_pages = 1-26

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 이 문서에는 캡션이 하나도 없다. 전문에서 Figure/Table/Fig. 가 0회.
#   → extract_figures.py 를 쓸 수 없다. tools/extract_images_bbox.py 를 쓴다.
# 아래 두 값은 형식상 남겨 둔 것으로 실제로 쓰이지 않는다.
caption_style = flat
caption_bold  = no

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 판형: A4 595.28×841.89 (쿼터니언 스터디와 동일)
# 실측(PDF p10): 본문 컬럼 x 72.0–523.3, 첫 줄 y 70.6, 푸터 y 790.4
clip_x   = 66-530
header_y = 66
body_x   = 76-520

# ── 메모 ─────────────────────────────────────────────────────────────
# 그림 29개 = 이미지 객체 29개 (1:1). bbox 방식이 정확하다 — 3_Pitfalls.md A10
#   p3(1) p4(2) p5(2) p6(3) p7(3) p8(1) p9(2) p11(1) p13(1) p14(2) p15(1)
#   p16(1) p18(1) p20(3) p23(2) p24(1) p25(2)
# 번호 붙은 수식: (1)~(91) — 누락·중복 없음, 순서 일치
# 절: 36개 (8개 장)
#
# ★ 이 문서는 본문에 파란 굵은 강조(#197fb2)가 있다 — p5 p6 p12 p16 p22 p25.
#   수식이 아니라 산문에 쓰인 색이므로 CSS span 으로 재현한다.
#   MathJax SVG 글리프는 currentColor 를 상속하므로 색칠한 span 안의 인라인
#   수식도 함께 물든다. \color 매크로가 필요 없어 B6 함정에 걸리지 않는다.
#
# ★ p26 에 Tip 박스(tcolorbox) 1개. 식 (91) 을 감싸고 있다.

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = Notes on Lie Theory
booktitle = Gyubeom Edward Im — 스터디 노트
