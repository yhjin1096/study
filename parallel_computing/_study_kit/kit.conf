# 스터디별 설정 — 이 파일을 스터디 루트에 `kit.conf` 로 복사해 값을 채운다.
# tools/extract_figures.py 와 tools/check_refs.py 가 읽는다.

# ── PDF ──────────────────────────────────────────────────────────────
# 생략하면 ref/ 안의 .pdf 를 자동으로 찾는다 (파일이 하나일 때만).
# pdf = ref/My Book.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 책에 인쇄된 쪽번호 + page_offset
#
# ⚠️ 추측하지 말고 반드시 검증하라. 책 앞뒤 여러 곳을 표본으로 확인한다:
#     pdftotext -f <PDF쪽> -l <PDF쪽> "ref/책.pdf" - | head -3
#   맨 윗줄에 찍힌 쪽번호와 비교하면 된다. 표지·목차 분량 때문에 책마다 다르고,
#   드물게 중간에 오프셋이 바뀌는 판형도 있다.
page_offset = 0

# ── 학습 범위 ────────────────────────────────────────────────────────
# 이 장 번호까지가 학습 범위. 이후 장을 참조하면 check_refs 가 '범위 밖'으로만 표시한다.
last_chapter = 99

# 책에 인쇄된 쪽번호의 유효 범위. `pdfinfo "ref/책.pdf" | grep Pages` 로 총 쪽수를 먼저 확인하라.
book_pages = 1-9999

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 책마다 그림 캡션 규약이 다르다. --list 로 아무것도 안 잡히면 여기를 의심하라.
#
#   caption_style = chapter   "Figure 6.3 설명"   장 번호 + 일련번호 (단행본에 흔함)
#                 = flat      "Figure 3: 설명"    문서 전체 연속 번호 (LaTeX article 에 흔함)
#   caption_bold  = yes       캡션 라벨이 볼드체 (단행본)
#                 = no        볼드가 아님 (LaTeX article). 이 경우 "라벨 + 콜론 + 설명"으로 판정
#
# 조사법은 3_Pitfalls.md A8 참조.
caption_style = chapter
caption_bold  = yes

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 책 판형마다 다르다. 맞추는 방법은 3_Pitfalls.md "레이아웃 상수 맞추기" 참조.
# 기본값은 단행본 판형(576×648pt)에서 잘 맞는다. A4(595×842)·Letter(612×792)는 다시 재야 한다.
#   A4 LaTeX article 예:  clip_x = 60-540 · header_y = 60 · body_x = 90-520
clip_x   = 155-522      # 본문 컬럼의 좌우 경계
header_y = 52           # 페이지 머리글 아래
body_x   = 186-488      # 이 폭을 모두 덮는 줄은 '본문 문단'으로 판정

# ── 메모 ─────────────────────────────────────────────────────────────
# 이 책에 존재하지 않는 그림 번호가 있다면 여기 적어 둔다 (check_refs 오탐 방지용 기록).
# missing_figures = Figure 3.1, Figure 8.15

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = My Book
booktitle = Author Name — 스터디 노트
