# 스터디별 설정 — Programming Massively Parallel Processors, 5th Edition
# tools/extract_figures.py 와 tools/check_refs.py 가 읽는다.

# ── PDF ──────────────────────────────────────────────────────────────
# ref/ 안에 PDF가 하나뿐이라 자동 탐색에 맡긴다.
# pdf = ref/Programming_Massively_Parallel_Processors.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# ⚠️ 이 책은 오프셋이 **하나가 아니다**. 구간마다 다르다.
#
# 장 사이의 빈 쪽(blank verso) 4장이 PDF 에서 빠져 있어, 뒤로 갈수록 오프셋이
# 28 → 24 로 1씩 줄어든다. 빠진 책 쪽은 182 · 288 · 452 · 476 (모두 빈 쪽).
# 스칼라 하나로 적으면 8장 이후가 통째로 어긋난다.
#
#   PDF  29-209  = 책   1-181   → +28
#   PDF 210-314  = 책 183-287   → +27
#   PDF 315-477  = 책 289-451   → +26
#   PDF 478-500  = 책 453-475   → +25
#   PDF 501-673  = 책 477-649   → +24
#
# 검증 방법 (두 개의 독립된 출처가 모두 일치했다):
#   ① 673쪽 전부에서 머리글의 인쇄 쪽번호를 읽어 오프셋이 바뀌는 지점을 찾음
#      (장 표제지는 쪽번호를 찍지 않으므로 그 쪽이 경계가 된다)
#   ② PDF 북마크 28개(1~24장 + 부록 A/B/C + Index)의 시작 쪽을 위 지도로 환산해
#      인쇄된 목차의 쪽번호와 대조 → 28건 전부 일치, 불일치 0건
#
# 쪽 범위를 다룰 때는 손으로 환산하지 말고 --book-pages 를 쓴다:
#   python3 _study_kit/tools/extract_figures.py --chapter 8 --book-pages 183-199 --list
page_offset = 28@29-209, 27@210-314, 26@315-477, 25@478-500, 24@501-673

# ── 학습 범위 ────────────────────────────────────────────────────────
# 24장 + 부록 A~C 전체가 범위. 부록은 장 번호가 없어 24로 둔다.
last_chapter = 24

# 책에 인쇄된 쪽번호의 유효 범위. 본문 1~629, Index 631~. (PDF 총 673쪽)
book_pages = 1-629

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 이 책은 "FIGURE 6.6" 처럼 장 번호 + 일련번호를 **전부 대문자**로 조판한다.
# 폰트는 TradeGothic-Bold 8.7pt 이므로 볼드 판정이 유효하다.
#   → caption_style = chapter, caption_bold = yes
# 대문자 조판은 tools/extract_figures.py·check_refs.py 의 캡션 정규식에
# re.I 를 넣어 대응했다 (라벨은 'Figure 6.6' 표기로 정규화된다).
caption_style = chapter
caption_bold  = yes

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 판형 540 x 666 pt. 킷 기본값(576x648 기준)이 맞지 않아 실측해 다시 잡았다.
#
# 이 책은 **좌우 여백이 홀짝쪽에서 뒤집히는(mirrored) 조판**이다:
#     PDF 짝수쪽 본문 x = 120 ~ 459
#     PDF 홀수쪽 본문 x =  84 ~ 423        (컬럼 폭은 양쪽 다 339pt)
# 도구는 고정된 상수 한 쌍만 받으므로 아래처럼 잡았다.
#
#   clip_x   양쪽의 합집합. 2~24장 전체에서 그림 요소의 실제 x 범위가
#            84.0 ~ 458.2 였으므로 여유 2pt를 두고 82-461.
#   body_x   양쪽의 교집합. "이 폭을 다 덮으면 본문 문단"이라는 판정이라
#            합집합을 쓰면 한쪽 parity 에서 본문을 놓친다.
#            짝수쪽 120~459 · 홀수쪽 84~423 이 모두 걸리는 값이 120-423.
#   header_y 머리글(쪽번호 + 장/절 제목)이 y=29 에 한 줄. 그 아래로 45.
clip_x   = 82-461
header_y = 45
body_x   = 120-423

# ── 메모 ─────────────────────────────────────────────────────────────
# 그림·표 총 361개 = 1~24장 337개 + 부록 A 11 · B 11 · C 1 + 머리말 Figure P.1.
#   Figure P.1 (PDF p23) 은 "Organization of the book" 그림이다. 장 번호가 없으니
#   --chapter P --pages 17-27 로 뽑는다 (머리말은 책 쪽번호가 로마자라 --pages 를 쓴다).
# 장별로는 1장 2개 ~ 23장 25개 (평균 14개). 10·11·13·16·17·18·20·23장이 많다.
#
# 이 책의 특징 몇 가지:
#   · 커널 코드 리스팅도 전부 Figure 번호를 달고 있어 그대로 추출된다.
#     노트에 코드를 손으로 옮겨 적을 필요가 없다.
#   · 캡션 표기가 종류마다 다르다. Figure 는 "FIGURE 6.6" (전부 대문자),
#     Table 은 "Table 19.1" (혼합). 도구는 대소문자를 무시하고 잡은 뒤
#     라벨을 "Figure 6.6" / "Table 19.1" 로 정규화한다.
#   · "FIGURE" 와 번호 사이의 공백만 Helvetica(비볼드)로 조판돼 있다.
#     볼드 span 만 이어 붙이면 라벨이 "FIGURE" 로 잘리므로, 공백 span 은
#     폰트를 따지지 않고 통과시키도록 고쳤다 (extract_figures.py·check_refs.py).
#   · 부록 그림은 "Figure A.1" 처럼 장 번호가 글자다. --chapter A 로 준다.
#
# 자동 추출이 안 되는 항목 (--clip 으로 직접 잘라낸다):
#   Table 19.1 (PDF p498) — 책에서 유일한 Table 이고, 캡션이 표 '위'에 있다.
#     도구는 캡션을 아래 경계로 보고 위쪽을 자르므로 "내용 없음"이 된다.
#     python3 _study_kit/tools/extract_figures.py \
#         --clip 163,132,342,268 --page 498 --name table19_1 --out <출력폴더>
#
# 이 책에 존재하지 않는 그림 번호는 아직 발견되지 않았다.
# missing_figures =

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = PMPP 5e
booktitle = Programming Massively Parallel Processors — 스터디 노트
