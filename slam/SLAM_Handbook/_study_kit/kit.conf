# 스터디별 설정 — 이 파일을 스터디 루트에 `kit.conf` 로 복사해 값을 채운다.
# tools/extract_figures.py 와 tools/check_refs.py 가 읽는다.

# ── PDF ──────────────────────────────────────────────────────────────
# 생략하면 ref/ 안의 .pdf 를 자동으로 찾는다 (파일이 하나일 때만).
pdf = ref/SLAM_Handbook.pdf

# ── 페이지 오프셋 ────────────────────────────────────────────────────
# PDF 페이지 = 책에 인쇄된 쪽번호 + page_offset
#
# 두 가지 표기를 쓸 수 있다.
#
#   page_offset = 21                          책 전체가 한 오프셋
#   page_offset = 28@29-209, 27@210-314       PDF 쪽 구간마다 다른 오프셋
#
# 구간은 **PDF 쪽번호** 기준이다 (책 쪽번호가 아니라).
#
# ⚠️ 표본 몇 개로 "검증했다"고 하지 마라. **오프셋이 중간에 바뀌는 책이 실제로 있다.**
#   장 사이의 빈 쪽(blank verso)이 PDF 에서 빠져 있으면 뒤로 갈수록 오프셋이 줄어드는데,
#   앞쪽만 보면 일정해 보여서 그대로 넘어가게 된다. 전수 조사가 답이다:
#
#     python3 - <<'EOF'
#     import fitz, re
#     d = fitz.open("ref/책.pdf")
#     prev = None
#     for i in range(d.page_count):
#         for b in d[i].get_text("dict")["blocks"]:
#             if b.get("type") != 0: continue
#             for ln in b["lines"]:
#                 if ln["bbox"][1] > 60: continue            # 머리글 영역만
#                 t = "".join(s["text"] for s in ln["spans"]).strip()
#                 if re.fullmatch(r"\d{1,4}", t):
#                     off = i + 1 - int(t)
#                     if off != prev:
#                         print(f"PDF {i+1:4d} = 책 {int(t):4d}  → offset {off}")
#                         prev = off
#     EOF
#
#   장 표제지는 쪽번호를 안 찍는 판형이 많아 위 스캔에 안 잡히고, 바로 그 쪽이 구간 경계다.
#   정한 뒤에는 **독립된 출처로 교차 검증하라** — PDF 북마크(doc.get_toc())의 장 시작 쪽을
#   환산해 인쇄된 목차의 쪽번호와 대조하면 된다. 자세한 것은 3_Pitfalls.md A1·A2·A10.
#
# 환산은 손으로 하지 말고 도구에 맡긴다:
#   extract_figures.py --book-pages 123-155        (책 쪽 → PDF 쪽 자동 환산)
#   kit_config.book_to_pdf(n) / pdf_to_book(n)
page_offset = 16

# ── 학습 범위 ────────────────────────────────────────────────────────
# 이 장 번호까지가 학습 범위. 이후 장을 참조하면 check_refs 가 '범위 밖'으로만 표시한다.
last_chapter = 18

# 책에 인쇄된 쪽번호의 유효 범위. `pdfinfo "ref/책.pdf" | grep Pages` 로 총 쪽수를 먼저 확인하라.
book_pages = 1-647

# ── 캡션 형식 ────────────────────────────────────────────────────────
# 책마다 그림 캡션 규약이 다르다. --list 로 아무것도 안 잡히면 여기를 의심하라.
#
#   caption_style = chapter   "Figure 6.3 설명"   장 번호 + 일련번호 (단행본에 흔함)
#                 = flat      "Figure 3: 설명"    문서 전체 연속 번호 (LaTeX article 에 흔함)
#   caption_bold  = yes       캡션 라벨이 볼드체 (단행본)
#                 = no        볼드가 아님 (LaTeX article). 이 경우 "라벨 + 콜론 + 설명"으로 판정
#
# 조사법은 3_Pitfalls.md A8 참조.
caption_style = chapter
caption_bold  = no       # ← 라벨 폰트가 CMR9(볼드 아님). yes 로 두면 캡션 225개를 전부 놓친다
caption_sep   = none     # "Figure 5.1 Range sensing…" — 콜론도 마침표도 없이 대문자로 설명이 시작
caption_size  = 8.0-10.5 # 라벨 글자 크기. 삽입된 논문 스크린샷 안의 3.9pt 캡션을 차단

# ── 그림 추출 레이아웃 (pt 단위) ─────────────────────────────────────
# 책 판형마다 다르다. 맞추는 방법은 3_Pitfalls.md "레이아웃 상수 맞추기" 참조.
# 기본값은 단행본 판형(576×648pt)에서 잘 맞는다. A4(595×842)·Letter(612×792)는 다시 재야 한다.
#   A4 LaTeX article 예:  clip_x = 60-540 · header_y = 60 · body_x = 90-520
clip_x   = 130-505      # A4 595x842. 본문 x=138~497 (홀짝 대칭)
header_y = 128          # 머리글 y1=122, 본문 시작 y=133
body_x   = 150-490      # 들여쓰기 첫 줄 x0=148~149 까지 포함

# 여백이 홀짝쪽에서 뒤집히는(mirrored) 판형이 있다. 그런 책은
#   clip_x = 양쪽의 합집합 (잘라낼 영역이니 넉넉해야 한다)
#   body_x = 양쪽의 교집합 (양쪽 parity 에서 모두 본문으로 판정돼야 한다)
# 로 잡는다. 한쪽만 보고 정하면 나머지 절반의 쪽에서 조용히 어긋난다.

# ── 절 제목 판정 (check_toc.py) ──────────────────────────────────────
# 목차의 쪽번호를 검증할 때 "그 쪽에 그 절 제목이 있는가"를 글자 크기로 판정한다.
# 머리글에도 절 제목이 반복 인쇄되는 판형이 많아, 크기와 세로 위치로 걸러야 한다.
# 값을 정하려면 절이 시작되는 쪽을 하나 골라 조사한다:
#     python3 _study_kit/tools/check_toc.py --survey <PDF쪽>
heading_size = 11.5     # 이보다 큰 글자만 '절 제목'으로 본다 (본문·머리글보다 커야 한다)
heading_gap  = 8        # 제목이 두 줄로 넘어갈 때 이 간격 안이면 한 제목으로 잇는다
# ⚠ 이 책은 절 제목이 본문과 **같은 10pt** 이고 볼드로만 구분된다 (LaTeX book 클래스).
#   그래서 heading_size 로는 절 제목을 하나도 못 잡는다. 폰트 이름으로 판정한다.
#     절 제목    CMBX10   10pt      하위 절  CMBXTI10 10pt
#     본문       CMR10    10pt      머리글   CMTI9     9pt
heading_font = CMBX

# ── 이 책 조사 결과 (2026-09-05 실측) ────────────────────────────────
# 판형      : A4 595.28 x 841.89 pt (kit 기본값 576x648 단행본과 다름)
# page_offset: 16, 전 구간 일정. PDF 북마크 146개로 교차검증 완료
#              (전수 스캔의 튀는 값들은 각 장 첫 쪽 머리글의 '장 번호' 오탐이다)
# 캡션      : Figure 225 / Table 8 / Algorithm 4. 라벨 폰트 CMR9 9pt (볼드 아님)
# ⚠ 오탐 1  : 책 p.14 Figure I.6 이 옛 SLAM 논문들을 콜라주한 그림이라,
#             그 안에 인쇄된 'Fig. 9.'(NimbusRomNo9L 3.9pt) 가 캡션으로 잡힌다.
#             → extract_figures.py 의 최소 글자크기 필터(min_caption_size)로 차단
# ⚠ 오탐 2  : Prelude 그림은 장 번호가 로마 숫자다 (Figure I.2 ~ I.7).
#             → --chapter I 로 준다 (부록의 Figure A.1 과 같은 처리)
# ⚠ 환경    : PyMuPDF 1.23.7 이 이 PDF 를 닫을 때 segfault(exit 139)를 낸다.
#             데이터는 정상 산출되므로 무시해도 되지만 `&&` 체이닝은 끊긴다.

# ── 메모 ─────────────────────────────────────────────────────────────
# 이 책에 존재하지 않는 그림 번호가 있다면 여기 적어 둔다 (check_refs 오탐 방지용 기록).
# missing_figures = Figure 3.1, Figure 8.15

# ── 사이드바 머리말 (build_html.py) ──────────────────────────────────
brand     = SLAM Handbook
booktitle = Carlone · Kim · Barfoot · Cremers · Dellaert — 스터디 노트
